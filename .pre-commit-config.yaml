repos:
  - repo: local
    hooks:
      - id: validate-json
        name: validate JSON
        entry: python3 -c 'import json, sys; [json.load(open(path)) for path in sys.argv[1:]]'
        language: system
        files: \.(json)$
        groups: [quality]

      - id: marketplace-overviews
        name: marketplace overview sync and tests
        entry: bash -c 'node --test scripts/sync-marketplace-overviews.test.mjs && node scripts/sync-marketplace-overviews.mjs --check'
        language: system
        files: ^(marketplace\.json|plugins/[^/]+/PLUGIN_OVERVIEW\.md|scripts/sync-marketplace-overviews(\.test)?\.mjs|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$
        groups: [marketplace, quality]
        pass_filenames: false

      - id: favicon-typecheck
        name: favicon typecheck
        entry: bash -c 'cd plugins/favicon && pnpm run typecheck'
        language: system
        files: ^plugins/favicon/
        groups: [favicon, typecheck]
        pass_filenames: false

      - id: jomo-typecheck
        name: jomo typecheck
        entry: bash -c 'cd plugins/jomo && pnpm run typecheck'
        language: system
        files: ^plugins/jomo/
        groups: [jomo, typecheck]
        pass_filenames: false

      - id: pi-extras-typecheck
        name: pi-extras typecheck
        entry: bash -c 'cd plugins/pi-extras && pnpm run lint'
        language: system
        files: ^plugins/pi-extras/
        groups: [pi-extras, typecheck]
        pass_filenames: false

      - id: rate-your-chat-typecheck
        name: rate-your-chat typecheck
        entry: bash -c 'cd plugins/rate-your-chat && pnpm run typecheck'
        language: system
        files: ^plugins/rate-your-chat/
        groups: [rate-your-chat, typecheck]
        pass_filenames: false

      - id: rate-your-chat-format
        name: rate-your-chat format
        entry: bash -c 'cd plugins/rate-your-chat && pnpm run lint'
        language: system
        files: ^plugins/rate-your-chat/
        groups: [rate-your-chat, format]
        pass_filenames: false

      - id: rate-your-chat-tests
        name: rate-your-chat tests
        entry: bash -c 'cd plugins/rate-your-chat && pnpm test'
        language: system
        files: ^plugins/rate-your-chat/
        groups: [rate-your-chat, test]
        stages: [pre-push]
        pass_filenames: false

      - id: review-workspace-format
        name: review-workspace format
        entry: bash -c 'cd plugins/review-workspace && pnpm run lint'
        language: system
        files: ^plugins/review-workspace/
        groups: [review-workspace, format]
        pass_filenames: false

      - id: review-workspace-tests
        name: review-workspace tests
        entry: bash -c 'cd plugins/review-workspace && pnpm test'
        language: system
        files: ^plugins/review-workspace/
        groups: [review-workspace, test]
        stages: [pre-push]
        pass_filenames: false

      - id: pi-extras-tests
        name: pi-extras tests
        entry: bash -c 'cd plugins/pi-extras && pnpm test && pnpm run test:components'
        language: system
        files: ^plugins/pi-extras/
        groups: [pi-extras, test]
        stages: [pre-push]
        pass_filenames: false
